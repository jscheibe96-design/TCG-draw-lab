<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TCG Draw Lab">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>TCG Draw Lab</title>
<style>
:root{--bg:#f1f5f9;--card:#fff;--tx:#0f172a;--mut:#64748b;--ln:#e2e8f0;--ac:#f59e0b;--on:#0f172a;--chip:#e2e8f0;--lnk:#0369a1;--bad:#dc2626;--ok:#16a34a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f172a;--card:#1e293b;--tx:#f1f5f9;--mut:#94a3b8;--ln:#334155;--chip:#334155;--lnk:#38bdf8;--bad:#f87171;--ok:#4ade80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f172a;--card:#1e293b;--tx:#f1f5f9;--mut:#94a3b8;--ln:#334155;--chip:#334155;--lnk:#38bdf8;--bad:#f87171;--ok:#4ade80;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif;max-width:640px;margin:0 auto;padding:10px 14px 60px}
h1{font-size:22px;margin:6px 0}h2{font-size:15px;margin:0 0 6px}
nav{display:flex;gap:6px;margin:8px 0}
nav button{flex:1;padding:9px 0;border:0;border-radius:10px;background:var(--card);color:var(--mut);font-weight:700;font-size:14px}
nav button.on{background:var(--ac);color:var(--on)}
.row{display:flex;gap:8px;margin-bottom:10px}
.btn{flex:1;padding:12px;border:0;border-radius:12px;background:var(--ac);color:var(--on);font-weight:800;font-size:15px}
.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--ln)}
.card{background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px}
.between{display:flex;justify-content:space-between;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:4px 8px;border-radius:8px;font-size:12px;font-weight:600;background:var(--chip);border:1px solid transparent}
.Pokémon{border-color:#f59e0b}.Trainer{border-color:#3b82f6}.Energy{border-color:#22c55e}
small{display:block;color:var(--mut);font-size:10px}
.mut{color:var(--mut);font-size:12px;margin:6px 0}.lbl{color:var(--mut);font-size:12px;font-weight:700;margin:8px 0 4px}
.bad{color:var(--bad);font-weight:700}.ok{color:var(--ok);font-weight:700}
a.l,.l{color:var(--lnk);font-weight:700;background:none;border:0;padding:6px 0;font-size:14px}
.sc{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--mut);font-size:11px;text-align:right;padding:4px}td{padding:5px 4px;text-align:right;border-bottom:1px solid var(--ln)}
th:first-child,td:first-child{text-align:left}td.hl{color:var(--ac);font-weight:800}
textarea{width:100%;background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:12px;padding:10px;font:12px/1.4 Menlo,monospace}
.step{width:38px;padding:6px 0;border:0;border-radius:8px;background:var(--ac);color:var(--on);font-weight:800;font-size:16px}
.hint{color:var(--mut);text-align:center;margin:14px 0}
@media(min-width:900px){body{max-width:1200px}.grid{display:grid;grid-template-columns:400px 1fr;gap:20px;align-items:start}aside{position:sticky;top:10px}#dk{height:55vh}}
</style>
</head>
<body>
<h1>TCG Draw Lab</h1>
<nav id="nav"></nav>
<main id="app"></main>
<script>
const DECK=`Pokémon: 13
2 Meowth ex POR 62
2 Dusknoir PRE 37
1 Greninja ex 30C 148
2 Greninja ex TWM 106
3 Froakie CRI 20
1 Latias ex SSP 76
2 Duskull PRE 35
1 Fezandipiti ex ASC 142
2 Dusclops PRE 36
1 Mega Froslass ex ASC 275
2 Snorunt ASC 46
1 Budew ASC 16
3 Frogadier CRI 21

Trainer: 13
1 Night Stretcher ASC 196
4 Buddy-Buddy Poffin TEF 144
4 Lillie's Determination MEG 119
1 Grand Tree SCR 136
3 Poké Pad POR 81
1 Gravity Mountain SSP 177
2 Boss's Orders MEG 114
1 Special Red Card CRI 82
1 Switch MEG 130
4 Ultra Ball MEG 131
2 Colress's Tenacity SFA 57
2 Hilda WHT 84
2 Rare Candy MEG 125

Energy: 3
5 Basic {W} Energy MEE 11
3 Ignition Energy WHT 86
1 Bubbly {W} Energy CRI 84

Total Cards: 60`;
let deckText=DECK,basicsText='Meowth ex, Froakie, Latias ex, Fezandipiti ex, Duskull, Snorunt, Budew';
let tab='Test',autoMull=true,rev=false,T=null,B=[],O={},X=10,entries=[],cards=[];
const TABS=['Test','10×','Analyse','Deck'];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct=x=>(x*100).toFixed(1).replace('.',',')+' %';
function parse(){
  const bs=basicsText.split(',').map(s=>s.trim().toLowerCase()).filter(Boolean);
  let sec='Trainer';entries=[];
  deckText.split('\n').forEach(raw=>{
    const l=raw.trim();if(!l||/^total/i.test(l))return;
    if(!/^\d/.test(l)){const h=l.match(/^(pok[eé]mon|trainer|energy)/i);
      if(h){const w=h[1].toLowerCase();sec=w.startsWith('pok')?'Pokémon':w.startsWith('train')?'Trainer':'Energy'}return}
    const m=l.match(/^(\d+)\s*x?\s+(.+)$/i);if(!m)return;
    const rest=m[2].trim(),nm=rest.match(/^(.*?)\s+([A-Za-z0-9]{2,5})\s+(\d+)$/),name=nm?nm[1]:rest;
    entries.push({key:rest,name,set:nm?nm[2]+' '+nm[3]:'',count:+m[1],type:sec,basic:sec==='Pokémon'&&bs.includes(name.toLowerCase())});
  });
  cards=entries.flatMap(e=>Array(e.count).fill(e));
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function deal(){
  if(cards.length<13)return{hand:[],prizes:[],deck:[],mull:0};
  const hb=cards.some(c=>c.basic);let mull=0,s;
  for(;;){s=shuffle(cards);if(!autoMull||!hb||s.slice(0,7).some(c=>c.basic)||mull>=100)break;mull++}
  return{hand:s.slice(0,7),prizes:s.slice(7,13),deck:s.slice(13),mull};
}
const cnt=a=>{const m={};a.forEach(c=>m[c.key]=(m[c.key]||0)+1);return m};
function atLeastOne(N,K,n){if(K<=0)return 0;if(n>=N-K+1)return 1;let p=1;for(let i=0;i<n;i++)p*=(N-K-i)/(N-i);return 1-p}
function chips(a,hidden){
  if(hidden)return'<div class="chips">'+a.map(()=>'<span class="chip">?</span>').join('')+'</div>';
  const c=cnt(a),seen={};
  const u=a.filter(x=>seen[x.key]?false:(seen[x.key]=1)).sort((x,y)=>x.type.localeCompare(y.type)||x.name.localeCompare(y.name));
  return'<div class="chips">'+u.map(x=>`<span class="chip ${x.type}">${c[x.key]}× ${esc(x.name)}</span>`).join('')+'</div>';
}
function tbl(deck,prizes,rv){
  const d=cnt(deck),p=cnt(prizes),n=deck.length+prizes.length;
  const rows=entries.map(e=>{const a=d[e.key]||0,b=p[e.key]||0;return{e,a,b,real:deck.length?a/deck.length:0,pl:n?(a+b)/n:0}})
    .sort((x,y)=>y.pl-x.pl||x.e.name.localeCompare(y.e.name));
  return'<div class="sc"><table><tr><th>Karte</th>'+(rv?'<th>Deck</th><th>Prize</th><th>Echt</th>':'<th>Unbek.</th>')+'<th>Spieler</th></tr>'+
    rows.map(r=>`<tr><td>${esc(r.e.name)}<small>${esc(r.e.set)}</small></td>${rv?`<td>${r.a}</td><td>${r.b}</td><td>${pct(r.real)}</td>`:`<td>${r.a+r.b}</td>`}<td class="hl">${pct(r.pl)}</td></tr>`).join('')+'</table></div>';
}
const mullBtn=()=>`<button class="btn g" onclick="autoMull=!autoMull;render()">Mulligan: ${autoMull?'auto':'aus'}</button>`;
function vTest(){
  let h=`<div class="row"><button class="btn" onclick="T=deal();render()">Neue Starthand</button>${mullBtn()}</div>`;
  if(!T)return h+'<p class="hint">Tippe auf „Neue Starthand“.</p>';
  const nb=!T.hand.some(c=>c.basic);
  return h+`<div class="card"><h2>Hand (${T.hand.length})${T.mull?' · '+T.mull+' Mulligan(s)':''}</h2>${chips(T.hand)}${nb?'<p class="bad">Kein Basis-Pokémon auf der Hand!</p>':''}</div>
  <div class="card"><div class="between"><h2>Preiskarten (${T.prizes.length})</h2><button class="l" onclick="rev=!rev;render()">${rev?'Verdecken':'Aufdecken'}</button></div>${chips(T.prizes,!rev)}</div>
  <div class="row"><button class="btn" onclick="if(T.deck.length){T.hand.push(T.deck.shift());render()}">Karte ziehen</button><button class="btn g" onclick="if(T.prizes.length){T.hand.push(T.prizes.shift());render()}">Preis nehmen</button></div>
  <div class="card"><h2>Nächste Karte · Deck: ${T.deck.length}</h2><p class="mut">Spieler = Sicht ohne Kenntnis der Preise. Echt = nur das Deck.</p>${tbl(T.deck,T.prizes,rev)}</div>`;
}
function vBatch(){
  let h=`<div class="row"><button class="btn" onclick="B=Array.from({length:10},deal);O={};render()">10× Starthand erzeugen</button>${mullBtn()}</div>`;
  if(!B.length)return h;
  h+=`<p class="hint">${B.filter(x=>x.hand.some(c=>c.basic)).length}/10 Hände mit Basis-Pokémon · ${B.reduce((a,x)=>a+x.mull,0)} Mulligan(s) insgesamt</p>`;
  return h+B.map((d,i)=>{
    const dc=cnt(d.deck),pc=cnt(d.prizes),n=d.deck.length+d.prizes.length;
    const top=entries.map(e=>({e,p:((dc[e.key]||0)+(pc[e.key]||0))/n})).sort((a,b)=>b.p-a.p).slice(0,4);
    const b=d.hand.some(c=>c.basic);
    return`<div class="card"><div class="between"><h2>Test #${i+1}</h2><span class="${b?'ok':'bad'}">${b?'Basis ✓':'Kein Basis'}${d.mull?' · '+d.mull+' Mull.':''}</span></div>
    <div class="lbl">Starthand</div>${chips(d.hand)}<div class="lbl">Preiskarten</div>${chips(d.prizes)}
    ${O[i]?'':`<p class="mut">Top nächste Karte: ${top.map(t=>esc(t.e.name)+' '+pct(t.p)).join(' · ')}</p>`}
    <button class="l" onclick="O[${i}]=!O[${i}];render()">${O[i]?'Wahrscheinlichkeiten ausblenden':'Alle Wahrscheinlichkeiten anzeigen'}</button>${O[i]?tbl(d.deck,d.prizes,true):''}</div>`}).join('');
}
function vAna(){
  const N=cards.length,bc=cards.filter(c=>c.basic).length,pb=atLeastOne(N,bc,7);
  const rows=entries.map(e=>({e,s:atLeastOne(N,e.count,7),p:atLeastOne(N,e.count,6),x:atLeastOne(N,e.count,X)})).sort((a,b)=>b.x-a.x||a.e.name.localeCompare(b.e.name));
  return`<div class="card"><h2>Eröffnung</h2><div>Basis-Pokémon im Deck: ${bc}</div><div>Basis in Starthand: ${pct(pb)} · Mulligan: ${pct(1-pb)}</div></div>
  <div class="card"><h2>Mind. 1 Kopie …</h2><div class="between"><span class="mut">… unter den ersten X Karten (X = ${X})</span><span><button class="step" onclick="X=Math.max(7,X-1);render()">−</button> <button class="step" onclick="X=Math.min(N0()-6,X+1);render()">+</button></span></div>
  <div class="sc"><table><tr><th>Karte</th><th>Anz.</th><th>Start</th><th>Prize</th><th>X</th></tr>${rows.map(r=>`<tr><td>${esc(r.e.name)}<small>${esc(r.e.set)}</small></td><td>${r.e.count}</td><td>${pct(r.s)}</td><td>${pct(r.p)}</td><td class="hl">${pct(r.x)}</td></tr>`).join('')}</table></div>
  <p class="mut">Start = in 7 Handkarten · Prize = mind. 1 Kopie unter den 6 Preiskarten</p></div>`;
}
const N0=()=>cards.length;
function vDeck(){
  const ok=cards.length===60;
  return`<div class="card"><h2 id="st" class="${ok?'ok':'bad'}">${cards.length} Karten${ok?' ✓':' (Deck sollte 60 haben)'}</h2><div class="mut" id="st2">${entries.length} verschiedene Karten erkannt</div></div>
  <div class="lbl">Basis-Pokémon (Namen, durch Komma getrennt)</div><textarea id="bas" rows="3" oninput="basicsText=this.value;parse();upd()">${esc(basicsText)}</textarea>
  <div class="between"><div class="lbl">Deckliste (PTCGL-Format)</div><button class="btn" style="flex:none;padding:8px 14px" onclick="pasteDeck()">📋 Einfügen</button></div><textarea id="dk" rows="22" autocapitalize="none" autocorrect="off" spellcheck="false" oninput="deckText=this.value;parse();upd()">${esc(deckText)}</textarea>`;
}
async function pasteDeck(){
  try{const t=await navigator.clipboard.readText();if(!t||!t.trim())throw new Error('leer');deckText=t;parse();T=null;B=[];O={};render()}
  catch(e){const el=document.getElementById('dk');if(el){el.focus();el.select()}alert('Direktes Einfügen wird hier blockiert oder die Zwischenablage ist leer. Das Feld ist markiert: Strg+V (am Handy: lange drücken → Einfügen).')}
}
function upd(){const ok=cards.length===60,s=document.getElementById('st');s.className=ok?'ok':'bad';s.textContent=cards.length+' Karten'+(ok?' ✓':' (Deck sollte 60 haben)');document.getElementById('st2').textContent=entries.length+' verschiedene Karten erkannt';const mn=document.getElementById('mn');if(mn&&tab==='Analyse')mn.innerHTML=vAna()}
const desk=()=>window.matchMedia('(min-width:900px)').matches;
let lastD=desk();
function main(){return tab==='Test'?vTest():tab==='10×'?vBatch():tab==='Analyse'?vAna():vDeck()}
function render(){
  const d=desk();if(d&&tab==='Deck')tab='Test';
  const ts=d?TABS.filter(t=>t!=='Deck'):TABS;
  document.getElementById('nav').innerHTML=ts.map(t=>`<button class="${t===tab?'on':''}" onclick="tab='${t}';render()">${t}</button>`).join('');
  document.getElementById('app').innerHTML=d?`<div class="grid"><aside><h2>Deckliste einfügen</h2>${vDeck()}</aside><section id="mn">${main()}</section></div>`:main();
}
window.addEventListener('resize',()=>{const d=desk();if(d!==lastD){lastD=d;render()}});
parse();render();
</script>
</body>
</html>
