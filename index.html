<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TCG Draw Lab">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>TCG Draw Lab</title>
<style>
:root{--bg:#f1f5f9;--card:#fff;--tx:#0f172a;--mut:#64748b;--ln:#e2e8f0;--ac:#f59e0b;--on:#0f172a;--chip:#e2e8f0;--lnk:#0369a1;--bad:#dc2626;--ok:#16a34a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f172a;--card:#1e293b;--tx:#f1f5f9;--mut:#94a3b8;--ln:#334155;--chip:#334155;--lnk:#38bdf8;--bad:#f87171;--ok:#4ade80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f172a;--card:#1e293b;--tx:#f1f5f9;--mut:#94a3b8;--ln:#334155;--chip:#334155;--lnk:#38bdf8;--bad:#f87171;--ok:#4ade80;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0 auto;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif;max-width:640px;padding:10px 14px 60px}
h1{font-size:22px;margin:6px 0}h2{font-size:15px;margin:0 0 6px}
nav{display:flex;gap:6px;margin:8px 0}
nav button{flex:1;padding:9px 0;border:0;border-radius:10px;background:var(--card);color:var(--mut);font-weight:700;font-size:14px}
nav button.on{background:var(--ac);color:var(--on)}
.row{display:flex;gap:8px;margin-bottom:10px}
.btn{flex:1;padding:12px;border:0;border-radius:12px;background:var(--ac);color:var(--on);font-weight:800;font-size:15px}
.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--ln)}
.card{background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px}
.between{display:flex;justify-content:space-between;align-items:center}
.pics{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px}
.pic{aspect-ratio:5/7;border-radius:6px;overflow:hidden;background:var(--chip);font-size:10px;display:flex;align-items:center;justify-content:center;text-align:center;padding:2px;font-weight:600}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic.back{background:linear-gradient(135deg,#1d4ed8,#7c3aed);color:#fff;font-weight:800;font-size:18px}
.nm{display:flex;align-items:center;gap:6px}.th{width:26px;aspect-ratio:5/7;object-fit:cover;border-radius:3px;flex:none}
small{display:block;color:var(--mut);font-size:10px}
.mut{color:var(--mut);font-size:12px;margin:6px 0}.lbl{color:var(--mut);font-size:12px;font-weight:700;margin:8px 0 4px}
.bad{color:var(--bad);font-weight:700}.ok{color:var(--ok);font-weight:700}
.l{color:var(--lnk);font-weight:700;background:none;border:0;padding:6px 0;font-size:14px}
.sc{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--mut);font-size:11px;text-align:right;padding:4px}td{padding:5px 4px;text-align:right;border-bottom:1px solid var(--ln)}
th:first-child,td:first-child{text-align:left}td.hl{color:var(--ac);font-weight:800}
textarea{width:100%;background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:12px;padding:10px;font:12px/1.4 Menlo,monospace}
.step{width:38px;padding:6px 0;border:0;border-radius:8px;background:var(--ac);color:var(--on);font-weight:800;font-size:16px}
.hint{color:var(--mut);text-align:center;margin:14px 0}
@media(min-width:900px){body{max-width:1200px}.grid{display:grid;grid-template-columns:400px 1fr;gap:20px;align-items:start}aside{position:sticky;top:10px}#dk{height:45vh}.mobonly{display:none}.pics{grid-template-columns:repeat(auto-fill,minmax(90px,1fr))}}
</style>
</head>
<body>
<h1>TCG Draw Lab</h1>
<nav id="nav"></nav>
<main id="app"></main>
<script>
let deckText='',basicsText='';
try{deckText=localStorage.getItem('tcg_deck')||'';basicsText=localStorage.getItem('tcg_basics')||''}catch(e){}
const save=()=>{try{localStorage.setItem('tcg_deck',deckText);localStorage.setItem('tcg_basics',basicsText)}catch(e){}};
let tab='Test',autoMull=true,rev=false,T=null,B=[],O={},X=10,entries=[],cards=[];
const TABS=['Test','10×','Analyse','Deck'];
const API='https://api.tcgdex.net/v2/en',cache={};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct=x=>(x*100).toFixed(1).replace('.',',')+' %';
const nz=s=>String(s).toLowerCase().replace(/[’‘`]/g,"'").replace(/é/g,'e');

function parse(){
  const bs=basicsText.split(',').map(s=>s.trim().toLowerCase()).filter(Boolean);
  let sec='Trainer';entries=[];
  deckText.split('\n').forEach(raw=>{
    const l=raw.trim();if(!l||/^total/i.test(l))return;
    if(!/^\d/.test(l)){const h=l.match(/^(pok[eé]mon|trainer|energy)/i);
      if(h){const w=h[1].toLowerCase();sec=w.startsWith('pok')?'Pokémon':w.startsWith('train')?'Trainer':'Energy'}return}
    const m=l.match(/^(\d+)\s*x?\s+(.+)$/i);if(!m)return;
    const rest=m[2].trim(),nm=rest.match(/^(.*?)\s+([A-Za-z0-9]{2,5})\s+(\d+)$/),name=nm?nm[1]:rest;
    entries.push({key:rest,name,set:nm?nm[2]+' '+nm[3]:'',count:+m[1],type:sec,manual:sec==='Pokémon'&&bs.includes(name.toLowerCase())});
  });
  entries.forEach(e=>{const c=cache[e.key]||{};e.img=c.img||'';e.src=c.src||'';e.basic=e.manual||!!c.basic});
  cards=entries.flatMap(e=>Array(e.count).fill(e));
}

/* ---- Kartenbilder & Basis-Erkennung: pokemontcg.io (Set-Code + Nummer), Fallback TCGdex (Name) ---- */
const COL={G:'Grass',R:'Fire',W:'Water',L:'Lightning',P:'Psychic',F:'Fighting',D:'Darkness',M:'Metal'};
async function jget(url,ms){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms||9000);
  try{const r=await fetch(url,{signal:c.signal});if(!r.ok)throw new Error(r.status);return await r.json()}finally{clearTimeout(t)}}
const cget=k=>{try{return JSON.parse(localStorage.getItem('tcg_c1_'+k))}catch(_){return null}};
const cset=(k,v)=>{try{localStorage.setItem('tcg_c1_'+k,JSON.stringify(v))}catch(_){}};
async function viaPTCG(e){
  const m=e.set.split(' ');if(m.length<2)return null;
  const j=await jget('https://api.pokemontcg.io/v2/cards?pageSize=5&select=id,name,images,supertype,subtypes&q='+encodeURIComponent('set.ptcgoCode:'+m[0]+' number:'+m[1]));
  const c=(j.data||[])[0];if(!c||!c.images)return null;
  if(e.type!=='Energy'&&!nz(c.name).includes(nz(e.name).split(' ')[0]))return null;
  return{img:c.images.small,basic:c.supertype==='Pokémon'&&(c.subtypes||[]).includes('Basic'),src:'pokemontcg.io'};
}
async function viaTCGdex(e){
  const API='https://api.tcgdex.net/v2/en';
  const num=parseInt((e.set.split(' ')[1]||''),10);
  const a=e.name.replace(/\{(\w)\}/g,(x,t)=>COL[t]||t),b=a.replace(/^Basic\s+/i,'');
  const okn=new Set([e.name,a,b].map(nz));
  const q=e.name.search(/['’]/),ac=e.name.indexOf('é');
  const cands=[...new Set([a,b,e.name,q>2?e.name.slice(0,q):'',ac>1?e.name.slice(0,ac):''].filter(Boolean))];
  for(const n of cands){
    try{
      const L=await jget(API+'/cards?name='+encodeURIComponent(n));if(!Array.isArray(L))continue;
      const ex=L.filter(x=>x.image&&okn.has(nz(x.name)));
      const c=ex.find(x=>parseInt(x.localId,10)===num)||ex[0];if(!c)continue;
      let stage='';
      if(e.type==='Pokémon'){try{stage=(await jget(API+'/cards/'+c.id)).stage||''}catch(_){}}
      return{img:c.image+'/low.webp',basic:/^basic/i.test(stage),src:'TCGdex'};
    }catch(_){}
  }
  return null;
}
async function lookup(e){
  if(cache[e.key])return cache[e.key];
  const k=cget(e.key);if(k&&k.img)return cache[e.key]=k;
  for(const f of[viaPTCG,viaTCGdex]){try{const r=await f(e);if(r&&r.img){cset(e.key,r);return cache[e.key]=r}}catch(_){}}
  return cache[e.key]={img:'',basic:false,src:''};
}
let tok=0;
async function loadImages(){
  const my=++tok,list=entries.slice();let i=0;
  list.forEach(e=>{if(cache[e.key]&&!cache[e.key].img)delete cache[e.key]});
  const w=async()=>{while(i<list.length){const e=list[i++];const r=await lookup(e);if(my!==tok)return;
    e.img=r.img;e.src=r.src||'';e.basic=e.manual||r.basic;stat();refresh()}};
  await Promise.all([w(),w(),w()]);
}
let rt;
function refresh(){clearTimeout(rt);rt=setTimeout(()=>{const mn=document.getElementById('mn');
  if(mn)mn.innerHTML=main();else if(tab!=='Deck')document.getElementById('app').innerHTML=main()},250)}
function stat(){
  const s=document.getElementById('st2'),s3=document.getElementById('st3');
  if(s){const p=entries.filter(e=>e.src==='pokemontcg.io').length,t=entries.filter(e=>e.src==='TCGdex').length;
    s.textContent=entries.length?entries.length+' verschiedene Karten · Bilder: '+entries.filter(e=>e.img).length+'/'+entries.length+' (pokemontcg.io: '+p+', TCGdex: '+t+') · Basis-Pokémon: '+cards.filter(c=>c.basic).length:'Kopiere die Deckliste aus Pokémon TCG Live (Deck → Exportieren) und füge sie ein.'}
  if(s3){const m=entries.filter(e=>!e.img&&cache[e.key]);s3.textContent=m.length?'Kein Bild gefunden: '+m.map(e=>e.name+(e.set?' ('+e.set+')':'')).join(', '):''}
}

/* ---- Spiel-Logik ---- */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function deal(){
  if(cards.length<13)return{hand:[],prizes:[],deck:[],mull:0};
  const hb=cards.some(c=>c.basic);let mull=0,s;
  for(;;){s=shuffle(cards);if(!autoMull||!hb||s.slice(0,7).some(c=>c.basic)||mull>=100)break;mull++}
  return{hand:s.slice(0,7),prizes:s.slice(7,13),deck:s.slice(13),mull};
}
const cnt=a=>{const m={};a.forEach(c=>m[c.key]=(m[c.key]||0)+1);return m};
function atLeastOne(N,K,n){if(K<=0)return 0;if(n>=N-K+1)return 1;let p=1;for(let i=0;i<n;i++)p*=(N-K-i)/(N-i);return 1-p}

/* ---- Darstellung ---- */
function pics(a,hidden){
  const s=hidden?a:a.slice().sort((x,y)=>x.type.localeCompare(y.type)||x.name.localeCompare(y.name));
  return'<div class="pics">'+s.map(c=>hidden?'<div class="pic back">?</div>':c.img?`<div class="pic"><img src="${esc(c.img)}" alt="${esc(c.name)}" loading="lazy" onerror="this.parentNode.textContent=this.alt"></div>`:`<div class="pic">${esc(c.name)}</div>`).join('')+'</div>';
}
function tbl(deck,prizes,rv){
  const d=cnt(deck),p=cnt(prizes),n=deck.length+prizes.length;
  const rows=entries.map(e=>{const a=d[e.key]||0,b=p[e.key]||0;return{e,a,b,real:deck.length?a/deck.length:0,pl:n?(a+b)/n:0}})
    .sort((x,y)=>y.pl-x.pl||x.e.name.localeCompare(y.e.name));
  return'<div class="sc"><table><tr><th>Karte</th>'+(rv?'<th>Deck</th><th>Prize</th><th>Echt</th>':'<th>Unbek.</th>')+'<th>Spieler</th></tr>'+
    rows.map(r=>`<tr><td><div class="nm">${r.e.img?`<img class="th" src="${esc(r.e.img)}" loading="lazy" onerror="this.remove()">`:''}<span>${esc(r.e.name)}<small>${esc(r.e.set)}</small></span></div></td>${rv?`<td>${r.a}</td><td>${r.b}</td><td>${pct(r.real)}</td>`:`<td>${r.a+r.b}</td>`}<td class="hl">${pct(r.pl)}</td></tr>`).join('')+'</table></div>';
}
const mullBtn=()=>`<button class="btn g" onclick="autoMull=!autoMull;render()">Mulligan: ${autoMull?'auto':'aus'}</button>`;
const empty=()=>cards.length<13?`<div class="card"><h2>Noch kein Deck</h2><p class="mut">Füge zuerst eine Deckliste ein. Sie bleibt auf diesem Gerät gespeichert.</p><button class="btn mobonly" style="width:100%" onclick="tab='Deck';render()">Zum Deck-Tab</button></div>`:'';
function vTest(){
  if(cards.length<13)return empty();
  let h=`<div class="row"><button class="btn" onclick="T=deal();render()">Neue Starthand</button>${mullBtn()}</div>`;
  if(!T)return h+'<p class="hint">Tippe auf „Neue Starthand“.</p>';
  const nb=!T.hand.some(c=>c.basic);
  return h+`<div class="card"><h2>Hand (${T.hand.length})${T.mull?' · '+T.mull+' Mulligan(s)':''}</h2>${pics(T.hand)}${nb?'<p class="bad">Kein Basis-Pokémon auf der Hand!</p>':''}</div>
  <div class="card"><div class="between"><h2>Preiskarten (${T.prizes.length})</h2><button class="l" onclick="rev=!rev;render()">${rev?'Verdecken':'Aufdecken'}</button></div>${pics(T.prizes,!rev)}</div>
  <div class="row"><button class="btn" onclick="if(T.deck.length){T.hand.push(T.deck.shift());render()}">Karte ziehen</button><button class="btn g" onclick="if(T.prizes.length){T.hand.push(T.prizes.shift());render()}">Preis nehmen</button></div>
  <div class="card"><h2>Nächste Karte · Deck: ${T.deck.length}</h2><p class="mut">Spieler = Sicht ohne Kenntnis der Preise. Echt = nur das Deck.</p>${tbl(T.deck,T.prizes,rev)}</div>`;
}
function vBatch(){
  if(cards.length<13)return empty();
  let h=`<div class="row"><button class="btn" onclick="B=Array.from({length:10},deal);O={};render()">10× Starthand erzeugen</button>${mullBtn()}</div>`;
  if(!B.length)return h;
  h+=`<p class="hint">${B.filter(x=>x.hand.some(c=>c.basic)).length}/10 Hände mit Basis-Pokémon · ${B.reduce((a,x)=>a+x.mull,0)} Mulligan(s) insgesamt</p>`;
  return h+B.map((d,i)=>{
    const dc=cnt(d.deck),pc=cnt(d.prizes),n=d.deck.length+d.prizes.length;
    const top=entries.map(e=>({e,p:((dc[e.key]||0)+(pc[e.key]||0))/n})).sort((a,b)=>b.p-a.p).slice(0,4);
    const b=d.hand.some(c=>c.basic);
    return`<div class="card"><div class="between"><h2>Test #${i+1}</h2><span class="${b?'ok':'bad'}">${b?'Basis ✓':'Kein Basis'}${d.mull?' · '+d.mull+' Mull.':''}</span></div>
    <div class="lbl">Starthand</div>${pics(d.hand)}<div class="lbl">Preiskarten</div>${pics(d.prizes)}
    ${O[i]?'':`<p class="mut">Top nächste Karte: ${top.map(t=>esc(t.e.name)+' '+pct(t.p)).join(' · ')}</p>`}
    <button class="l" onclick="O[${i}]=!O[${i}];render()">${O[i]?'Wahrscheinlichkeiten ausblenden':'Alle Wahrscheinlichkeiten anzeigen'}</button>${O[i]?tbl(d.deck,d.prizes,true):''}</div>`}).join('');
}
function vAna(){
  if(cards.length<13)return empty();
  const N=cards.length,bc=cards.filter(c=>c.basic).length,pb=atLeastOne(N,bc,7);
  const rows=entries.map(e=>({e,s:atLeastOne(N,e.count,7),p:atLeastOne(N,e.count,6),x:atLeastOne(N,e.count,X)})).sort((a,b)=>b.x-a.x||a.e.name.localeCompare(b.e.name));
  return`<div class="card"><h2>Eröffnung</h2><div>Basis-Pokémon im Deck: ${bc}</div><div>Basis in Starthand: ${pct(pb)} · Mulligan: ${pct(1-pb)}</div></div>
  <div class="card"><h2>Mind. 1 Kopie …</h2><div class="between"><span class="mut">… unter den ersten X Karten (X = ${X})</span><span><button class="step" onclick="X=Math.max(7,X-1);render()">−</button> <button class="step" onclick="X=Math.min(cards.length-6,X+1);render()">+</button></span></div>
  <div class="sc"><table><tr><th>Karte</th><th>Anz.</th><th>Start</th><th>Prize</th><th>X</th></tr>${rows.map(r=>`<tr><td><div class="nm">${r.e.img?`<img class="th" src="${esc(r.e.img)}" loading="lazy" onerror="this.remove()">`:''}<span>${esc(r.e.name)}<small>${esc(r.e.set)}</small></span></div></td><td>${r.e.count}</td><td>${pct(r.s)}</td><td>${pct(r.p)}</td><td class="hl">${pct(r.x)}</td></tr>`).join('')}</table></div>
  <p class="mut">Start = in 7 Handkarten · Prize = mind. 1 Kopie unter den 6 Preiskarten</p></div>`;
}
const stTxt=()=>cards.length?cards.length+' Karten'+(cards.length===60?' ✓':' (Deck sollte 60 haben)'):'Noch kein Deck eingefügt';
const stCls=()=>cards.length===60?'ok':cards.length?'bad':'mut';
function vDeck(){
  return`<button class="btn" style="width:100%;margin-bottom:10px" onclick="pasteDeck()">📋 Deckliste einfügen</button>
  <div class="card"><h2 id="st" class="${stCls()}">${stTxt()}</h2><div class="mut" id="st2"></div><div class="mut bad" id="st3"></div></div>
  <button class="btn g" style="width:100%;margin-bottom:10px" onclick="testConn()">🔧 Verbindung testen</button><div class="card" id="st4" style="display:none;white-space:pre-wrap;font-size:12px"></div>
  <div class="lbl">Deckliste (PTCGL-Format) – oder hier hineinkopieren</div>
  <textarea id="dk" rows="12" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Deckliste aus Pokémon TCG Live hier einfügen …" oninput="onDeck(this.value)">${esc(deckText)}</textarea>
  <div class="lbl">Basis-Pokémon manuell ergänzen (optional, sonst automatisch erkannt)</div>
  <textarea id="bas" rows="2" placeholder="z. B. Froakie, Budew" oninput="basicsText=this.value;save();parse();upd()">${esc(basicsText)}</textarea>`;
}
async function testConn(){
  const el=document.getElementById('st4');el.style.display='block';el.textContent='Teste …';
  const T=[['pokemontcg.io Karte','https://api.pokemontcg.io/v2/cards/base1-4?select=name',j=>j.data.name],
   ['pokemontcg.io Set-Code (MEG 131)','https://api.pokemontcg.io/v2/cards?pageSize=1&select=name&q='+encodeURIComponent('set.ptcgoCode:MEG number:131'),j=>(j.data[0]||{}).name||'0 Treffer'],
   ['TCGdex Karte','https://api.tcgdex.net/v2/en/cards/swsh3-136',j=>j.name+' / '+(j.image?'Bild ok':'kein Bild')]];
  let out='Seite: '+location.protocol+'//'+location.host+'\n';
  for(const [n,u,f] of T){try{out+='✓ '+n+': '+f(await jget(u,12000))+'\n'}catch(e){out+='✗ '+n+': '+e.name+' – '+e.message+'\n'}el.textContent=out+'…'}
  el.textContent=out;
}
let dt;
function onDeck(v){deckText=v;save();parse();upd();clearTimeout(dt);dt=setTimeout(loadImages,700)}
async function pasteDeck(){
  try{const t=await navigator.clipboard.readText();if(!t||!t.trim())throw new Error('leer');deckText=t;save();parse();T=null;B=[];O={};render();loadImages()}
  catch(e){const el=document.getElementById('dk');if(el){el.focus();el.select()}alert('Direktes Einfügen wird hier blockiert oder die Zwischenablage ist leer. Das Feld ist markiert: Strg+V (am Handy: lange drücken → Einfügen).')}
}
function upd(){const s=document.getElementById('st');if(s){s.className=stCls();s.textContent=stTxt()}stat();if(tab==='Analyse')refresh()}
const desk=()=>window.matchMedia('(min-width:900px)').matches;
let lastD=desk();
function main(){return tab==='Test'?vTest():tab==='10×'?vBatch():tab==='Analyse'?vAna():vDeck()}
function render(){
  const d=desk();if(d&&tab==='Deck')tab='Test';
  const ts=d?TABS.filter(t=>t!=='Deck'):TABS;
  document.getElementById('nav').innerHTML=ts.map(t=>`<button class="${t===tab?'on':''}" onclick="tab='${t}';render()">${t}</button>`).join('');
  document.getElementById('app').innerHTML=d?`<div class="grid"><aside><h2>Deckliste</h2>${vDeck()}</aside><section id="mn">${main()}</section></div>`:main();
  stat();
}
window.addEventListener('resize',()=>{const d=desk();if(d!==lastD){lastD=d;render()}});
parse();if(!cards.length)tab='Deck';render();if(cards.length)loadImages();
</script>
</body>
</html>
